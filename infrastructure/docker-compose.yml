version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aam
      POSTGRES_PASSWORD: aam_secret
      POSTGRES_DB: ai_agent_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
