name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm -r typecheck || echo "typecheck skipped until deps fully resolved"
      - name: Secret scan (basic)
        run: |
          if grep -rE '(sk-[a-zA-Z0-9]{20,}|api[_-]?key["\s:=]+[a-zA-Z0-9]{16,})' --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "Possible secret found"
            exit 1
          fi
          echo "No obvious secrets found"
