name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate --schema prisma/schema.prisma
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run typecheck --if-present
      - name: Secret scan
        run: |
          if grep -rE '(sk-[a-zA-Z0-9]{20,}|api[_-]?key["\s:=]+[a-zA-Z0-9]{16,})' --exclude-dir=node_modules --exclude-dir=.git . ; then exit 1; fi
