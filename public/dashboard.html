<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>داشبورد — AI Agent Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:Vazirmatn,sans-serif}.card{background:#0f172a;border:1px solid #1e293b;border-radius:18px}</style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <header class="border-b border-slate-800 px-5 py-4 flex justify-between items-center">
    <div><div class="font-extrabold text-lg">AI Agent Manager</div><div class="text-xs text-slate-500">کنسول مدیریت</div></div>
    <a href="/" class="text-sm text-indigo-400">خانه</a>
  </header>
  <main class="max-w-5xl mx-auto px-5 py-8 space-y-5">
    <section class="card p-5">
      <div class="flex flex-wrap gap-3 items-center justify-between">
        <div><h1 class="text-2xl font-bold">داشبورد</h1><p class="text-slate-400 text-sm mt-1">وضعیت سرویس، حساب و اعتبار شما</p></div>
        <div id="status" class="text-sm px-3 py-2 rounded-lg bg-slate-800">در حال بررسی...</div>
      </div>
    </section>

    <section class="grid md:grid-cols-3 gap-4">
      <div class="card p-5"><div class="text-slate-400 text-sm">وضعیت دیتابیس</div><div id="db" class="text-xl font-bold mt-2">—</div></div>
      <div class="card p-5"><div class="text-slate-400 text-sm">اعتبار</div><div id="credits" class="text-xl font-bold mt-2">—</div></div>
      <div class="card p-5"><div class="text-slate-400 text-sm">پلن</div><div id="plan" class="text-xl font-bold mt-2">—</div></div>
    </section>

    <section class="grid lg:grid-cols-2 gap-5">
      <div class="card p-5 space-y-3">
        <h2 class="font-bold">ورود / ثبت‌نام</h2>
        <input id="email" type="email" placeholder="ایمیل" autocomplete="email" class="w-full bg-slate-800 rounded-lg px-3 py-2 outline-none" />
        <input id="password" type="password" placeholder="رمز عبور (۶ تا ۱۲۸ کاراکتر)" autocomplete="current-password" class="w-full bg-slate-800 rounded-lg px-3 py-2 outline-none" />
        <input id="name" type="text" placeholder="نام (برای ثبت‌نام)" class="w-full bg-slate-800 rounded-lg px-3 py-2 outline-none" />
        <div class="flex gap-2"><button onclick="registerUser()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg">ثبت‌نام</button><button onclick="loginUser()" class="border border-slate-600 hover:bg-slate-800 px-4 py-2 rounded-lg">ورود</button></div>
      </div>
      <div class="card p-5 space-y-3">
        <h2 class="font-bold">شارژ اعتبار</h2>
        <p class="text-sm text-slate-400">درگاه واقعی پس از تنظیم PAYMENT_PROVIDER فعال می‌شود.</p>
        <input id="amount" type="number" min="1000" max="100000000" value="100000" class="w-full bg-slate-800 rounded-lg px-3 py-2" />
        <button onclick="checkout()" class="w-full bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg">ایجاد پرداخت</button>
        <button onclick="loadMe()" class="w-full border border-slate-700 px-4 py-2 rounded-lg">به‌روزرسانی حساب</button>
      </div>
    </section>

    <pre id="out" class="card p-4 text-xs text-slate-300 overflow-auto min-h-24 whitespace-pre-wrap"></pre>
  </main>
<script>
const API='/api';
const $=id=>document.getElementById(id);
const token=()=>localStorage.getItem('token')||'';
function show(x){$('out').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
async function request(path, options={}){
  const headers={...(options.headers||{}),'Content-Type':'application/json'};
  if(token()) headers.Authorization='Bearer '+token();
  const r=await fetch(API+path,{...options,headers});
  let data; try{data=await r.json()}catch{data={error:'INVALID_RESPONSE'}}
  if(!r.ok) throw Object.assign(new Error(data.message||data.error||('HTTP '+r.status)),{data,status:r.status});
  return data;
}
async function health(){
  try{const d=await request('/health');$('db').textContent=d.database==='connected'?'متصل':d.database;$('status').textContent=d.status==='ok'?'API سالم':'API نیازمند تنظیمات';show(d)}
  catch(e){$('status').textContent='خطا';show(e.message)}
}
function applyAccount(d){$('credits').textContent=d.tenant?d.tenant.credits:'—';$('plan').textContent=d.tenant?d.tenant.plan:'—';}
async function loadMe(){
  if(!token()){applyAccount({});show('ابتدا وارد شوید.');return}
  try{const d=await request('/auth/me');applyAccount(d);show(d)}catch(e){localStorage.removeItem('token');applyAccount({});show(e.message)}
}
async function registerUser(){
  try{const d=await request('/auth/register',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value,name:$('name').value||undefined})});localStorage.setItem('token',d.token);applyAccount(d);show(d)}catch(e){show(e.data||e.message)}
}
async function loginUser(){
  try{const d=await request('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});localStorage.setItem('token',d.token);applyAccount(d);show(d)}catch(e){show(e.data||e.message)}
}
async function checkout(){
  try{const d=await request('/billing/checkout',{method:'POST',body:JSON.stringify({amount:Number($('amount').value)})});show(d);if(d.status==='SUCCESS')await loadMe()}catch(e){show(e.data||e.message)}
}
health();loadMe();
</script>
</body>
</html>
