<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت مرکزی — AI Agent Manager</title>
<script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Vazirmatn,sans-serif}.card{background:#0f172a;border:1px solid #1e293b;border-radius:18px}</style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
<header class="border-b border-slate-800 px-5 py-4 flex justify-between items-center"><div><b class="text-lg">AI Agent Manager</b><div class="text-xs text-slate-500">مرکز کنترل مدیر</div></div><a href="/dashboard.html" class="text-indigo-400 text-sm">داشبورد کاربر</a></header>
<main class="max-w-6xl mx-auto p-5 space-y-5">
<section class="card p-5"><div class="flex justify-between gap-3 flex-wrap"><div><h1 class="text-2xl font-extrabold">مرکز مدیریت</h1><p id="identity" class="text-slate-400 mt-1">در حال بررسی دسترسی...</p></div><button onclick="load()" class="border border-slate-700 px-4 py-2 rounded-lg">به‌روزرسانی</button></div></section>
<section class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4"><div class="card p-5"><div class="text-slate-400 text-sm">وضعیت API</div><div id="api" class="text-xl font-bold mt-2">—</div></div><div class="card p-5"><div class="text-slate-400 text-sm">دیتابیس</div><div id="db" class="text-xl font-bold mt-2">—</div></div><div class="card p-5"><div class="text-slate-400 text-sm">پلن مدیر</div><div id="plan" class="text-xl font-bold mt-2">—</div></div><div class="card p-5"><div class="text-slate-400 text-sm">اعتبار</div><div id="credits" class="text-xl font-bold mt-2">—</div></div></section>
<section class="grid lg:grid-cols-2 gap-5"><div class="card p-5"><h2 class="font-bold mb-3">کنترل‌های پلتفرم</h2><div class="space-y-2 text-sm text-slate-300"><div>👤 مدیریت کاربران و نقش‌ها</div><div>🤖 مدیریت Agentها</div><div>▶️ اجرای Agent و ثبت Run</div><div>🧰 Tools / MCP</div><div>💳 Billing و Credits</div><div>📊 مصرف و درآمد</div><div>🛡️ امنیت و Audit Log</div></div></div><div class="card p-5"><h2 class="font-bold mb-3">وضعیت محیط</h2><pre id="out" class="text-xs text-slate-300 whitespace-pre-wrap overflow-auto"></pre></div></section>
</main>
<script>
const API='/api',token=()=>localStorage.getItem('token')||'';async function req(p){const h={};if(token())h.Authorization='Bearer '+token();const r=await fetch(API+p,{headers:h});let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw new Error(d.error||'خطا');return d}
async function load(){try{const [h,m]=await Promise.all([req('/health'),req('/auth/me')]);if(m.user?.role!=='ADMIN'){document.body.innerHTML='<main class="min-h-screen grid place-items-center p-6"><div class="card p-8 text-center"><h1 class="text-xl font-bold">دسترسی غیرمجاز</h1><p class="text-slate-400 mt-2">این صفحه فقط برای مدیر سیستم است.</p></div></main>';return}document.getElementById('identity').textContent=`مدیر: ${m.user.email} — نقش: ${m.user.role}`;document.getElementById('api').textContent=h.status==='ok'?'سالم':'نیازمند بررسی';document.getElementById('db').textContent=h.database;document.getElementById('plan').textContent=m.tenant?.plan||'—';document.getElementById('credits').textContent=m.tenant?.credits??'—';document.getElementById('out').textContent=JSON.stringify({user:m.user,tenant:m.tenant,health:h},null,2)}catch(e){document.getElementById('identity').textContent='ابتدا با حساب مدیر وارد شوید.';document.getElementById('out').textContent=e.message}}
load();
</script></body></html>
