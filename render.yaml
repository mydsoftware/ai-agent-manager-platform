services:
  - type: web
    name: ai-agent-manager-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate --schema prisma/schema.prisma && npx prisma db push --schema prisma/schema.prisma --skip-generate --accept-data-loss
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
