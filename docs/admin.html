<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — AI Agent Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>body{font-family:Vazirmatn,sans-serif}</style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
  <h1 class="text-2xl font-bold mb-2">Admin</h1>
  <p class="text-slate-400 text-sm mb-4">فقط role=ADMIN</p>
  <button onclick="load()" class="bg-indigo-600 px-4 py-2 rounded-lg mb-4">بارگذاری overview</button>
  <pre id="out" class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs"></pre>
  <p class="mt-4"><a href="dashboard.html" class="text-indigo-400">داشبورد</a></p>
  <script src="config.js"></script>
  <script>
    async function load() {
      const api = (localStorage.getItem('API_URL') || window.AAM_CONFIG.API_URL).replace(/\/$/, '');
      const token = localStorage.getItem('token') || '';
      const r = await fetch(api + '/admin/overview', { headers: { Authorization: 'Bearer ' + token } });
      document.getElementById('out').textContent = JSON.stringify(await r.json(), null, 2);
    }
  </script>
</body>
</html>
