<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>body{font-family:Vazirmatn,sans-serif}</style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <header class="border-b border-slate-800 px-6 py-4 flex justify-between items-center flex-wrap gap-3">
    <div class="font-bold text-lg">AI Agent Manager</div>
    <nav class="flex gap-4 text-sm">
      <a href="dashboard.html" class="text-slate-300 hover:text-white">داشبورد</a>
      <a href="admin.html" class="text-slate-300 hover:text-white">Admin</a>
    </nav>
  </header>
  <main class="max-w-3xl mx-auto px-6 py-16 text-center">
    <p class="text-xs text-amber-400/90 mb-4">Frontend: GitHub Pages · API جدا (بدون Secret در Pages)</p>
    <h1 class="text-4xl font-bold mb-4">مدیریت ایجنت‌های هوشمند</h1>
    <p class="text-slate-400 mb-8">پلتفرم Open-Core — ثبت‌نام، ایجنت، اجرا، حافظه و اعتبار</p>
    <div class="flex flex-wrap gap-3 justify-center">
      <a href="dashboard.html" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-semibold">ورود به داشبورد</a>
      <button id="ping" class="border border-slate-600 px-6 py-3 rounded-xl">وضعیت API</button>
    </div>
    <pre id="health" class="mt-8 text-left text-xs bg-slate-900 border border-slate-800 rounded-xl p-4 overflow-auto text-slate-300"></pre>
  </main>
  <script src="config.js"></script>
  <script>
    document.getElementById('ping').onclick = async () => {
      const el = document.getElementById('health');
      el.textContent = 'در حال اتصال به ' + window.AAM_CONFIG.API_URL + ' ...';
      try {
        const r = await fetch(window.AAM_CONFIG.API_URL + '/health');
        el.textContent = JSON.stringify(await r.json(), null, 2);
      } catch (e) {
        el.textContent = 'خطا: ' + e.message;
      }
    };
  </script>
</body>
</html>
