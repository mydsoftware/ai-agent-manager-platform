<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — AI Agent Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>body{font-family:Vazirmatn,sans-serif}</style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 md:p-6">
  <div class="max-w-4xl mx-auto space-y-4">
    <div class="flex flex-wrap justify-between items-center gap-2">
      <h1 class="text-2xl font-bold">داشبورد</h1>
      <a href="index.html" class="text-indigo-400 text-sm">خانه</a>
    </div>
    <p class="text-slate-400 text-sm">GitHub Pages → Render API</p>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
      <label class="text-xs text-slate-400">API_URL</label>
      <div class="flex gap-2 flex-wrap">
        <input id="apiUrl" class="flex-1 min-w-[200px] bg-slate-800 rounded-lg px-3 py-2 text-sm" />
        <button type="button" id="btnSaveApi" class="bg-slate-700 px-3 py-2 rounded-lg text-sm">ذخیره</button>
        <button type="button" id="btnPing" class="bg-indigo-700 px-3 py-2 rounded-lg text-sm">تست اتصال</button>
      </div>
    </div>

    <div id="health" class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs text-slate-300">...</div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 max-w-md space-y-3">
      <h2 class="font-semibold">ورود / ثبت‌نام</h2>
      <input id="email" type="email" placeholder="ایمیل" class="w-full bg-slate-800 rounded-lg px-3 py-2" />
      <input id="password" type="password" placeholder="رمز (حداقل ۶)" class="w-full bg-slate-800 rounded-lg px-3 py-2" />
      <input id="name" type="text" placeholder="نام (اختیاری)" class="w-full bg-slate-800 rounded-lg px-3 py-2" />
      <div class="flex gap-2 flex-wrap">
        <button type="button" id="btnRegister" class="bg-indigo-600 px-4 py-2 rounded-lg">ثبت‌نام</button>
        <button type="button" id="btnLogin" class="border border-slate-600 px-4 py-2 rounded-lg">ورود</button>
        <button type="button" id="btnMe" class="border border-slate-600 px-4 py-2 rounded-lg">من کیستم</button>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
      <h2 class="font-semibold">ایجنت‌ها</h2>
      <div class="flex gap-2 flex-wrap">
        <input id="agentName" placeholder="مثلا My Assistant" class="bg-slate-800 rounded-lg px-3 py-2 text-sm" />
        <button type="button" id="btnCreateAgent" class="bg-emerald-600 px-4 py-2 rounded-lg text-sm">ساخت</button>
        <button type="button" id="btnListAgents" class="border border-slate-600 px-4 py-2 rounded-lg text-sm">لیست</button>
      </div>
      <div id="agents" class="text-sm text-slate-300"></div>
    </div>

    <div class="bg-amber-950/40 border border-amber-800/50 rounded-xl p-3 text-xs text-amber-200">
      خطاها اینجا می‌مانند تا کپی کنی. اگر چیزی ندیدی، F12 → Network را باز کن.
    </div>
    <pre id="out" class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs overflow-auto min-h-[120px] whitespace-pre-wrap"></pre>
  </div>

  <script src="config.js"></script>
  <script>
    var DEFAULT_API = 'https://ai-agent-manager-platform.onrender.com/api';
    var lastError = null;

    function apiBase() {
      var fromLs = null;
      try { fromLs = localStorage.getItem('API_URL'); } catch (e) {}
      if (fromLs && fromLs.indexOf('vercel.app') !== -1) {
        try { localStorage.removeItem('API_URL'); } catch (e) {}
        fromLs = null;
      }
      var fromCfg = (window.AAM_CONFIG && window.AAM_CONFIG.API_URL) || DEFAULT_API;
      return String(fromLs || fromCfg || DEFAULT_API).replace(/\/$/, '');
    }

    function token() {
      try { return localStorage.getItem('token') || ''; } catch (e) { return ''; }
    }

    function authHeaders() {
      var h = { 'Content-Type': 'application/json' };
      var t = token();
      if (t) h['Authorization'] = 'Bearer ' + t;
      return h;
    }

    function show(x) {
      var text = typeof x === 'string' ? x : JSON.stringify(x, null, 2);
      document.getElementById('out').textContent = text;
      try { console.log('[AAM]', x); } catch (e) {}
    }

    function showError(where, e, extra) {
      lastError = {
        where: where,
        message: (e && e.message) ? e.message : String(e),
        extra: extra || null,
        time: new Date().toISOString()
      };
      show(lastError);
    }

    function val(id) {
      var el = document.getElementById(id);
      return el ? el.value : '';
    }

    async function fetchJson(path, opts) {
      opts = opts || {};
      opts.headers = Object.assign({}, authHeaders(), opts.headers || {});
      opts.mode = 'cors';
      var url = apiBase() + path;
      var r = await fetch(url, opts);
      var text = await r.text();
      var data;
      try { data = JSON.parse(text); } catch (e) { data = { raw: text }; }
      return { ok: r.ok, status: r.status, data: data, url: url };
    }

    async function ping() {
      var el = document.getElementById('health');
      var base = apiBase();
      el.textContent = 'checking ' + base + ' ...';
      try {
        var r = await fetch(base + '/health', { mode: 'cors' });
        var j = await r.json();
        el.textContent = JSON.stringify(j);
        show({ health: j, api: base });
      } catch (e) {
        el.textContent = 'API offline: ' + e.message;
        showError('ping', e, { api: base });
      }
    }

    async function register() {
      try {
        var res = await fetchJson('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            email: val('email').trim(),
            password: val('password'),
            name: val('name').trim() || undefined
          })
        });
        if (res.data && res.data.token) {
          try { localStorage.setItem('token', res.data.token); } catch (e) {}
        }
        show({ status: res.status, data: res.data });
      } catch (e) { showError('register', e); }
    }

    async function login() {
      try {
        var res = await fetchJson('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: val('email').trim(),
            password: val('password')
          })
        });
        if (res.data && res.data.token) {
          try { localStorage.setItem('token', res.data.token); } catch (e) {}
        }
        show({ status: res.status, data: res.data });
      } catch (e) { showError('login', e); }
    }

    async function me() {
      try {
        var res = await fetchJson('/auth/me');
        show({ status: res.status, data: res.data });
      } catch (e) { showError('me', e); }
    }

    async function createAgent() {
      var name = val('agentName').trim();
      if (!name) return show({ error: 'نام لازم است — مثلا My Assistant' });
      if (!token()) return show({ error: 'اول ورود کن (token نیست)' });
      try {
        var res = await fetchJson('/agents', {
          method: 'POST',
          body: JSON.stringify({
            name: name,
            tools: ['web_search'],
            systemPrompt: 'You are a helpful agent.'
          })
        });
        show({ action: 'createAgent', status: res.status, url: res.url, data: res.data });
        if (res.ok) listAgents();
      } catch (e) { showError('createAgent', e); }
    }

    async function listAgents() {
      if (!token()) return show({ error: 'اول ورود کن (token نیست)' });
      try {
        var res = await fetchJson('/agents');
        var list = (res.data && res.data.agents) || [];
        document.getElementById('agents').innerHTML = list.length
          ? list.map(function (a) {
              return '<div class="border border-slate-700 rounded-lg p-2 mb-1 flex justify-between gap-2">' +
                '<span>' + (a.name || '') + ' <span class="text-slate-500 text-xs">' + (a.id || '') + '</span></span>' +
                '<button type="button" class="text-indigo-400 text-xs" data-run="' + a.id + '">اجرا</button></div>';
            }).join('')
          : '<span class="text-slate-500">ایجنتی نیست</span>';
        show({ action: 'listAgents', status: res.status, data: res.data });
        document.querySelectorAll('[data-run]').forEach(function (btn) {
          btn.onclick = function () { runAgent(btn.getAttribute('data-run')); };
        });
      } catch (e) { showError('listAgents', e); }
    }

    async function runAgent(id) {
      try {
        var res = await fetchJson('/agents/' + id + '/run', {
          method: 'POST',
          body: JSON.stringify({ input: { message: 'سلام' }, maxIterations: 3 })
        });
        show({ action: 'runAgent', status: res.status, data: res.data });
      } catch (e) { showError('runAgent', e); }
    }

    document.getElementById('btnSaveApi').onclick = function () {
      var v = val('apiUrl').trim();
      if (v) { try { localStorage.setItem('API_URL', v); } catch (e) {} }
      ping();
    };
    document.getElementById('btnPing').onclick = ping;
    document.getElementById('btnRegister').onclick = register;
    document.getElementById('btnLogin').onclick = login;
    document.getElementById('btnMe').onclick = me;
    document.getElementById('btnCreateAgent').onclick = createAgent;
    document.getElementById('btnListAgents').onclick = listAgents;

    document.getElementById('apiUrl').value = apiBase();
    ping();
  </script>
</body>
</html>
